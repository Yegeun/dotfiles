# kitty.conf — managed by ~/dotfiles, symlinked to ~/.config/kitty
# Ported from the old wezterm.lua; the colour scheme deliberately matches tmux.conf.

# ---- Font ----
# "MesloLGS Nerd Font Mono" is the family name reported by the font that
# `brew install --cask font-meslo-lg-nerd-font` puts in ~/Library/Fonts.
# The Nerd Font build already carries the powerline and devicon glyphs that
# powerlevel10k, the tmux status line and nvim draw, so no fallback family
# is configured (there is no Symbols Nerd Font installed to fall back to).
font_family      MesloLGS Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ---- Colours ----
# Catppuccin Macchiato, the same flavour tmux.conf sets.
include catppuccin-macchiato.conf

# ---- Terminal type ----
# kitty defaults to TERM=xterm-kitty. Keep xterm-256color: tmux.conf matches
# on that exact name to turn RGB truecolor on
# (`terminal-overrides ',xterm-256color:RGB'`), and it keeps ssh to hosts
# without kitty's terminfo working.
term xterm-256color

# ---- Window ----
background_opacity   0.95
window_padding_width 10

# ---- Tabs ----
# Hide the tab bar while there is only one tab.
tab_bar_min_tabs 2

# ---- macOS ----
# Quitting the last window quits the app, matching the old setup's feel.
macos_quit_when_last_window_closed yes
